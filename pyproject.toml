[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_dog"
version = "0.1.0"
description = "机器狗及其他具身设备遥测的 Agentic 故障调查平台 —— 一个会自己调查、关联、裁决并输出结构化调查报告的 Agent。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "data_dog" }]
keywords = ["agent", "telemetry", "robotics", "anomaly-detection", "llm"]
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]
ui = [
    "streamlit>=1.30.0",
]
rag = [
    "chromadb>=0.4.0",
]
# 生产数据库驱动（本地 SQLite 无需安装；连 PostgreSQL 时装）
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
data-dog = "data_dog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_dog = ["py.typed"]

[tool.pytest.ini_options]
# 屏蔽已知的第三方库弃用提示（来自 starlette，与项目代码无关），保持测试输出干净。
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:No path_separator found in configuration:DeprecationWarning",
]
# postgres 标记：默认跳过，需 DD_TEST_PG_URL 指向真实 PG 才跑（CI 的 pg job）。
markers = [
    "postgres: 需要真实 PostgreSQL 的集成测试（设 DD_TEST_PG_URL 才运行）",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F=pycodestyle+pyflakes，I=isort，UP=pyupgrade。保持克制：先守住真正重要的。
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]        # 行长由 formatter/line-length 管理

[tool.ruff.lint.per-file-ignores]
# Typer 的官方写法就是在默认值里调用 typer.Option/Argument（B008 会误报）
"src/data_dog/cli.py" = ["B008"]

[tool.mypy]
# 用 3.12 做类型检查：numpy>=2.5 的 .pyi 用了 PEP 695（`type` 语句），
# mypy 在 python_version=3.10 下无法解析其存根，导致检查直接中断。
# 代码本身仍是 3.10 兼容（`from __future__ import annotations`），
# requires-python 的 >=3.10 下限不变；这里只是让检查器能跑起来。
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# 渐进式：先不开 disallow_untyped_defs（存量代码未全注解），后续收紧
check_untyped_defs = true
