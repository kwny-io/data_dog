[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_dog"
version = "0.1.0"
description = "机器狗及其他具身设备遥测的 Agentic 故障调查平台 —— 一个会自己调查、关联、裁决并输出结构化调查报告的 Agent。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "data_dog" }]
keywords = ["agent", "telemetry", "robotics", "anomaly-detection", "llm"]
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0,<3",
    "types-PyYAML",
    # 3.10 没有 tomllib（3.11 才进标准库），而项目 requires-python >=3.10：
    # pyproject 的解析用它（scripts/gen_requirements.py、scripts/readme_counts.py、
    # tests/test_project_meta.py），故在 3.10 上补 tomli 兜底。
    "tomli>=2.0; python_version < '3.11'",
    # 性质测试（hypothesis）：把安全边界的断言从"我举了几个例子"换成"对所有输入都成立"。
    # 同一份代码每次跑同一批输入（用例里 derandomize=True），不破坏"全离线确定性"。
    "hypothesis>=6.100",
    # 内存版 Redis：让 redis 后端的用例**离线**可跑（不装则那 1 项 skip）。
    # 项目主打"全离线确定性"，测试依赖也一并给全，别让默认套件留残缺。
    "fakeredis>=2.0",
]
ui = [
    "streamlit>=1.30.0",
]
rag = [
    "chromadb>=0.4.0",
]
# 生产数据库驱动（本地 SQLite 无需安装；连 PostgreSQL 时装）
postgres = [
    "psycopg[binary]>=3.1",
]
# Redis 共享状态后端（限流/候选归并跨副本一致时装）。
# 注意：这里约束的是**客户端**版本，与**服务端**版本无关。客户端 8.x 默认 RESP3
# （连接发 `HELLO 3`，Redis 6 才有）——本项目显式用 RESP2（见 state/redis.py
# make_client），故服务端 Redis ≥ 2 即可，Redis 5.x 老环境也能跑。
redis = [
    "redis>=5.0",
]
# 流式接入的可选传输（file/http 用标准库，无需装；mqtt/kafka 需客户端）
mqtt = [
    "paho-mqtt>=2.0",
]
kafka = [
    "kafka-python>=2.0",
]
# 算子编译期安全扫描（G8）：依赖 SCA。缺失时扫描步标记 skipped（非静默通过）。
scan = [
    "pip-audit>=2.7",
]
# SBOM 生成（G8）：CycloneDX 格式。缺失时用内置最小实现（结构合法，如实标注不完整）。
sbom = [
    "cyclonedx-bom>=4.0",
]
# 算子沙箱加强项（P4-1，均**可选**，不装也能跑；缺省降级见 docs/p4/01_sandbox.md §6）
# wasm：用 wasmtime 承载纯计算（预留最优档，本版未接线）
wasm = [
    "wasmtime>=20.0",
]
# seccomp：Linux 下禁算子 socket/connect/open/execve（best-effort）
seccomp = [
    "pyseccomp>=0.1.2",
]
# 一次装齐沙箱全部加强项
sandbox = [
    "wasmtime>=20.0",
    "pyseccomp>=0.1.2",
]
# MuJoCo 忠实仿真数据源（生成/评估百万级试验数据集；核心包不依赖它）
sim = [
    "mujoco>=3.1",
]
# 算子签名加强项（P4-2）：Ed25519 验签（默认 HMAC-SHA256 用标准库，无需安装）。
# 未装时 Ed25519 请求明确报错、绝不静默降级（见 operator_factory/signing.py）。
signing = [
    "cryptography>=42.0",
]
# 无损视觉证据（VISTA-1 式）：裁剪/放大需要 Pillow。缺失时视觉工具**不暴露**（零回归），
# 见 docs/agent_memory_and_vision.md §2。
vision = [
    "pillow>=10.0",
]

[project.scripts]
data-dog = "data_dog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_dog = ["py.typed"]

[tool.pytest.ini_options]
# 屏蔽已知的第三方库弃用提示（来自 starlette，与项目代码无关），保持测试输出干净。
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:No path_separator found in configuration:DeprecationWarning",
]
# postgres 标记：默认跳过，需 DD_TEST_PG_URL 指向真实 PG 才跑（CI 的 pg job）。
markers = [
    "postgres: 需要真实 PostgreSQL 的集成测试（设 DD_TEST_PG_URL 才运行）",
    "redis: 需要真实 Redis 的集成测试（设 DD_TEST_REDIS_URL 才运行）",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F=pycodestyle+pyflakes，I=isort，UP=pyupgrade。保持克制：先守住真正重要的。
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]        # 行长由 formatter/line-length 管理

[tool.ruff.lint.per-file-ignores]
# Typer 的官方写法就是在默认值里调用 typer.Option/Argument（B008 会误报）
"src/data_dog/cli.py" = ["B008"]
# FastAPI 同理：官方写法就是在参数默认值里调用 Depends/Header/Query（B008 会误报）
"src/data_dog/service/routes/*.py" = ["B008"]
"src/data_dog/service/deps.py" = ["B008"]

[tool.mypy]
# 用 3.12 做类型检查：numpy>=2.5 的 .pyi 用了 PEP 695（`type` 语句），
# mypy 在 python_version=3.10 下无法解析其存根，导致检查直接中断。
# 代码本身仍是 3.10 兼容（`from __future__ import annotations`），
# requires-python 的 >=3.10 下限不变；这里只是让检查器能跑起来。
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# 渐进式：先不开 disallow_untyped_defs（存量代码未全注解），后续收紧
check_untyped_defs = true
