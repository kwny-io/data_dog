[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_dog"
version = "0.1.0"
description = "机器狗及其他具身设备遥测的 Agentic 故障调查平台 —— 一个会自己调查、关联、裁决并输出结构化调查报告的 Agent。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "data_dog" }]
keywords = ["agent", "telemetry", "robotics", "anomaly-detection", "llm"]
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
ui = [
    "streamlit>=1.30.0",
]
rag = [
    "chromadb>=0.4.0",
]
# 生产数据库驱动（本地 SQLite 无需安装；连 PostgreSQL 时装）
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
data-dog = "data_dog.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_dog = ["py.typed"]

[tool.pytest.ini_options]
# 屏蔽已知的第三方库弃用提示（来自 starlette，与项目代码无关），保持测试输出干净。
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
