# CI：每次 push / PR 跑静态检查 + 类型检查 + 全量测试（SQLite）+ PostgreSQL 集成测试。
#
# 设计取舍（诚实标注）：
# - **离线优先**：默认套件不依赖任何 API Key / 网络（确定性 provider），
#   因此 CI 可复现、不会因外部服务抖动而红。
# - **两条测试腿**：
#     1) `test` 腿在 SQLite 上跑全量套件（快、零依赖）；
#     2) `postgres` 腿起真实 PostgreSQL:16，跑标了 `@pytest.mark.postgres`
#        的集成测试（迁移 + 租户隔离在真库上的行为）。这才是"PG 兼容"的实证，
#        而不是只断言连接串字符串。
# - **覆盖率门禁**：基线实测约 74%，门禁设为 70%（留出合理余量，避免因个别
#   新代码抖动就误红）。
# - **Python 3.12**：与 Dockerfile 一致；numpy>=2.5 的存根本身也要求 >=3.12。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支的新 push 取消上一次仍在跑的 CI，省额度也更快看到结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查与类型检查（ruff + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src

  test:
    name: 全量测试（SQLite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: 跑测试（覆盖率门禁 70%）
        run: |
          pytest -q \
            --cov=data_dog \
            --cov-report=term-missing \
            --cov-fail-under=70

  postgres:
    name: PostgreSQL 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: data_dog
          POSTGRES_PASSWORD: data_dog_ci_pw
          POSTGRES_DB: data_dog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_dog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DD_TEST_PG_URL: postgresql+psycopg://data_dog:data_dog_ci_pw@127.0.0.1:5432/data_dog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: 跑 PostgreSQL 集成测试
        run: pytest -q -m postgres
