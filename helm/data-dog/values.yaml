# data-dog Helm chart 默认值（适合 kind / 本地集群）。
# 生产覆盖见 values.prod.yaml，并**务必**用 --set 或 -f 注入密钥（或用 existingSecret）。

# ---- 镜像 ----
image:
  repository: data-dog
  # 省略则用 Chart.appVersion
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---- 非敏感配置（进 ConfigMap，作为所有工作负载的 env 来源）----
# 每一项对应 data_dog 的一个 DD_* 环境变量（见 src/data_dog/settings.py）。
# 多副本**必须**让状态/限流外置：memory 后端会让各副本各算各的（见 §3.3）。
config:
  DD_SERVICE_NAME: data-dog
  DD_SERVICE_HOST: "0.0.0.0"
  DD_SERVICE_PORT: "8000"
  # 多副本共享状态后端（memory 会让限流/候选合并各算各的）
  DD_STATE_BACKEND: postgres
  # 生产多副本**必须** 0：多个实例同时启动会并发跑迁移、互相竞争。
  # 迁移由 migrate Job（Helm hook）在应用启动前跑一次。
  DD_AUTO_MIGRATE: "0"
  DD_LOG_LEVEL: INFO
  DD_LOG_JSON: "1"
  # 流式接入默认关（由 stream.enabled 单独控制消费者工作负载）
  DD_STREAM_ENABLED: "0"
  DD_PROJECT_ROOT: /app
  DD_VENDOR_DOCS: /app/vendor_docs
  DD_OPERATORS_DIR: /app/operators
  # 通知/值班/升级（P4-3）。默认关：告警流止于 SaaS adapter（落库审计）。
  # ⚠ 打开后**升级 sweeper 是 API 副本的进程内线程**——多副本会各自扫、重复升级
  #   （虽因幂等键收敛到同一行，仍会重复投递）。多副本启用前需加租约（见
  #   docs/p4/03_notify_oncall.md §6）。单副本可安全打开。
  DD_NOTIFY_ENABLED: "0"
  # 通知目标的 SSRF 门：默认失败关闭（拒内网/回环）。受信内网才置 1。
  DD_NOTIFY_ALLOW_PRIVATE: "0"
  DD_NOTIFY_ACK_SLA_S: "300"

# ---- 敏感配置（不进 values 明文；由外部 Secret 注入）----
# secret.existingSecret 非空 → 用它；否则用 secret.create 由本 chart 建
# （create 时 values 里的值会被写进 Secret，**仅本地 demo 用**，生产别这么干）。
secret:
  existingSecret: ""
  create: false
  # 仅当 create=true 时使用（键名即环境变量名）：
  data:
    DD_DATABASE_URL: ""
    DD_API_KEY: ""
    DD_OPERATOR_SIGNING_KEY: ""
    DD_REDIS_URL: ""
    # 通知凭据（P4-3）：**不进 values 明文**，由外部 Secret 注入。
    DD_SMTP_HOST: ""
    DD_SMTP_USER: ""
    DD_SMTP_PASSWORD: ""
    DD_IM_WEBHOOK_URL: ""

# ---- API 工作负载（无状态，可任意扩缩）----
api:
  replicas: 3
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  # 探针路径对齐 src/data_dog/service/app.py：/healthz 存活、/readyz 就绪（含 DB/stream 检查）
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  # 额外环境变量（追加到 config+secret 之后）
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---- 流式消费者工作负载（独立扩缩理由，见 §3.3）----
stream:
  enabled: false
  # file 源只能 1；kafka/mqtt 可 >1（靠消费者组/共享订阅协调）
  replicas: 1
  # 源类型：kafka / mqtt / file（决定多副本是否安全——file 多副本会被拒绝启动）
  source: file
  # 车队级分片（P4-5）：**仅对"每个副本收全量"的源**（coordination=none）生效。
  # kafka/mqtt 共享订阅由 broker 分区，留空即可（客户端不再过滤，避免叠加丢事件）。
  # ⚠ 非空时：所有副本必须看到**相同**列表，且本副本 id 必须属于该列表；否则进程
  #   启动即失败关闭（防"跳过所有消息"的静默丢数据）。id 来自 Pod 名（见模板），
  #   故应配合 StatefulSet 使用以得到稳定可枚举的 Pod 名（如 stream-0,stream-1,…）。
  replicaMembers: []
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---- 迁移 Job（Helm hook：pre-install/pre-upgrade）----
migrate:
  enabled: true
  # 用与 api 同一镜像跑 `python -m data_dog.storage.migrations upgrade`
  backoffLimit: 3
  activeDeadlineSeconds: 300
  # hook 删除策略：新 hook 创建前删旧的，避免同名 Job 冲突
  hookDeletePolicy: before-hook-creation

# ---- Service ----
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ---- Ingress（可选；也可沿用仓库既有的 Caddy 反代）----
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: data-dog.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- HPA（按 CPU 起步；自定义指标需 Prometheus Adapter，见 §6）----
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  # 可选：按内存
  targetMemoryUtilizationPercentage: ""

# ---- PDB（滚动更新/节点维护时不一次性打光副本）----
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ---- Prometheus Operator ServiceMonitor（可选）----
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}

# ---- Prometheus Operator 告警规则（可选）----
# 把 docs/slo.md §9 的目标变成"会响的"规则。与 ServiceMonitor 同一前提：
# 集群需装 Prometheus Operator（提供 PrometheusRule CRD）。
# 阈值与 docs/slo.md §9 的表一一对应——改这里请同步改文档（反之亦然）。
prometheusRule:
  enabled: false
  # 供 Prometheus Operator 选中本规则对象的标签（如 release: kube-prometheus-stack），
  # 不是告警路由标签；severity 等路由标签写在规则里。
  labels: {}
  # 异步调查待办深度阈值（持续 15 分钟超过才告警）
  queueDepthThreshold: 50
  # 30 分钟内失败调查数阈值
  failureCountThreshold: 5
  # 分区有效期不足多少秒开始告警（默认 14 天）。
  # 只在 partition.enabled=true 的部署里生效：没有分区表就没有这个样本。
  partitionHorizonSeconds: 1209600
  # LLM 请求 P95 延时阈值（秒）。同步调查要等一次真 LLM，这里只看"模型/链路是不是变慢了"。
  llmLatencyP95Seconds: 60
  # LLM 超时+不可用占全部请求的比例阈值（0.05 = 5%）。
  llmFailureRate: 0.05
  # 待投递队列积压阈值（同一条过阈值持续 15 分钟才告警）。
  outboxBacklogThreshold: 100
  # 15 分钟内"证据引用被拒"次数阈值：涨起来通常是有人在探测越权。
  evidenceDeniedThreshold: 20


# ---- 分区维护（A9）：分区表的"生产最后一公里" ----
# 为什么必须有定时任务：以日桶为分区键时，跨月那一刻若没有对应分区，写入直接报
# `no partition of relation ... found for row`，而在这之前**没有任何信号**。
# CLI（scripts/partition_telemetry.py）能做，但它得有人按时运行。
# 与应用侧 DD_PARTITION_AUTO_ENSURE 不重叠：那个是"副本启动时补一次"，这里是集群层每天兜底。
partition:
  enabled: false
  # 每天 03:23（避开整点，减少与其它任务撞峰）。幂等：已存在的分区不会被重建。
  schedule: "23 3 * * *"
  # 本月起往后保证几个月存在。>1 是留给"任务连挂几天/发布阻塞"的余量。
  ensureMonths: 3
  concurrencyPolicy: Forbid
  # 超过这个时间没被调度就不再补跑（避免发布后一次性补一堆过期任务）。
  startingDeadlineSeconds: 600
  # CLI 的退出码 3 = 租约被别的入口持有（"这轮不该我干"，不是配置错）。K8s 会把它
  # 当失败按指数退避重试（约 10s→20s→40s），正好当"等对方放手"的应用级退避用；
  # 所以 Failed Job 历史里有零星记录是**预期**的，别当故障。幂等（CREATE TABLE IF
  # NOT EXISTS ... PARTITION OF），重试不会重复建。
  backoffLimit: 3
  resources: {}

# ---- 数据保留清理（④）：删过期数据。与分区维护**刻意分开**（结构变更 vs 删数据）----
retention:
  enabled: false
  schedule: "41 3 * * *"
  # ⚠ **默认 dry-run**：定时任务里"默认删数据"是不可接受的默认值。要真删必须显式改这里。
  dryRun: true
  concurrencyPolicy: Forbid
  backoffLimit: 3
  resources: {}
