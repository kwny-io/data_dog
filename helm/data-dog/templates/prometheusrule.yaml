{{- if .Values.prometheusRule.enabled }}
# 把 docs/slo.md §9 的目标变成**会响的**规则。
#
# 为什么需要这一层：ServiceMonitor 只解决"抓得到"，不解决"有人被叫醒"。指标齐全但一条
# 规则都没有，SLO 就只活在文档里；`audit_write_failed` 这类注释写着"必须告警"的计数器
# 也只是空头承诺。本文件是那句话的兑现。
#
# 前提：集群装了 Prometheus Operator（提供 PrometheusRule CRD）——与 ServiceMonitor 同一前提。
# 阈值口径与 docs/slo.md §9 的表一一对应；**改这里必须同步改那张表**（反之亦然）。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "data-dog.fullname" . }}
  labels:
    {{- include "data-dog.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # ---- 可用性：目标"服务在、且没在报错" ----
    - name: data-dog.availability
      rules:
        - alert: DataDogApiErrorRateHigh
          # clamp_min 防分母为 0：完全没有流量时不该判成"错误率 100%"。
          expr: |
            (
              sum(rate(data_dog_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(data_dog_http_requests_total[5m])), 0.001)
            ) > 0.01
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "data_dog API 5xx 比例 > 1%（持续 10 分钟）"
            description: >-
              5xx / 全部请求。**本仓没有可用性百分比目标**（docs/slo.md §7 明确不承诺），
              1% 是工程阈值：抢在"用户感知明显"之前。先看 /readyz 与 DB/StateStore 依赖，
              定位用 GET /v1/investigations/runs 与安全审计，规则表见 docs/slo.md §9。
        - alert: DataDogIngestLatencyP99High
          # 只算接入热路径（候选产出端到端预算 P99 ≤ 500ms）。**不要**把
          # /v1/investigations 混进来：同步调查要等一次真 LLM（10-60s），会把热路径的
          # P99 直接带偏——那正是 histogram 补长桶要分开看的两条路。
          expr: |
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(data_dog_http_request_duration_seconds_bucket{path="/v1/telemetry"}[10m])
              )
            ) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "接入热路径 P99 > 500ms（SLO §3 预算上限）"
            description: >-
              仅 POST /v1/telemetry。P99 超标通常意味着**落库排队**而不是算子慢，
              根因分析见 docs/write_path_batching.md。
        - alert: DataDogTargetDown
          expr: up{job=~".*data-dog.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "data_dog 抓取目标掉线（up=0）"
            description: >-
              Prometheus 抓不到 /metrics。先确认 Pod Ready、ServiceMonitor 选中的端口与
              Service 的 targetPort 一致。
        - alert: DataDogAuthDisabled
          # 未启用鉴权 = 端口开放即任何人可读写（README「诚实边界」明说）。
          expr: data_dog_auth_enabled == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "API 鉴权未启用（DD_API_KEY 为空）"
            description: "演示环境以外必须失败关闭：不含鉴权的服务不该对外可达。"
    # ---- 慢路径：异步调查（治理与积压）----
    - name: data-dog.investigation
      rules:
        - alert: DataDogInvestigationQueueBacklog
          # 待办深度持续高于阈值 = 提交快于消费（假受理的可见窗口）。
          expr: data_dog_investigation_queue_depth > {{ .Values.prometheusRule.queueDepthThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "异步调查待办积压超过阈值（持续 15 分钟）"
            description: >-
              队列在 StateStore 里**无长度上限**（有意的失败开放），所以积压只能靠这条规则
              被发现。先看 worker 是否活着、再考虑扩副本；现在是"已受理但要等"。
        - alert: DataDogInvestigationFailures
          expr: increase(data_dog_investigation_jobs_total{status="failed"}[30m]) > {{ .Values.prometheusRule.failureCountThreshold }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "30 分钟内调查失败次数超过阈值"
            description: >-
              失败会 fail-closed 到人工（不是静默）。逐条失败上下文在调查运行日志里：
              GET /v1/investigations/runs 与 /v1/investigations/jobs/{job_id}/log。
        - alert: DataDogLlmBudgetExceeded
          # 额度硬熔断被触发。**故意不带租户标签**（避免基数爆炸）：能知道"有人撞线"，
          # 不能从指标里知道是谁——要知道是谁得查审计/运行日志，这是有意的边界。
          expr: increase(data_dog_llm_budget_exceeded_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "有租户的 LLM 额度/花费被熔断（15 分钟内）"
            description: >-
              额度按"接活前 / 跑一半"分阶段（stage 标签）。撞线属预期治理行为，
              短时间多次说明上限设得太紧或有人在刷候选。
    # ---- 数据完整性：静默失败的唯一可见窗口 ----
    - name: data-dog.integrity
      rules:
        - alert: DataDogAuditWriteFailed
          # 审计写不进去**不会**让业务请求失败——只能靠这个计数器发现。审计缺失=合规缺口。
          expr: increase(data_dog_audit_write_failed_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "安全审计写入失败（10 分钟内 > 0 次）"
            description: "审计是只增证据，写不进去等于合规缺口。查 DB 写权限/磁盘/RLS 通道。"
        - alert: DataDogWriteBehindDataLoss
          # 开了 write-behind 后，failed / rejected_full 都意味着"响应已 200 但数据没落库"。
          expr: increase(data_dog_write_behind_total{result=~"failed|rejected_full"}[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "write-behind 丢数据（响应已 200 但未落库）"
            description: >-
              仅 DD_WRITE_BEHIND=1 时有意义。failed=写失败，rejected_full=队列满拒收；
              两者都是静默丢数据的证据，必须当事故处理。
        - alert: DataDogOutboxBacklog
          # 待投递（告警外发）队列积压：投递 worker 停了 / 下游持续失败时会一直涨。
          expr: max(data_dog_db_rows{table="outbox_pending"})
            > {{ .Values.prometheusRule.outboxBacklogThreshold }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "待投递队列积压 > 阈值（持续 15 分钟）"
            description: >-
              积压意味着"告警产生了但没送出去"。先看投递 worker 是否在跑（/readyz 的 checks），
              再看目标端点是否在拒收（失败重试会把 pending 堆起来）。
        {{- if .Values.stream.enabled }}
        - alert: DataDogStreamDown
          # 只在**本 chart 开了消费者**的部署里断言：否则 API Pod 的 stream_up=0
          # （未启用）会把 max 拉到 0，形成永久误报。
          expr: max(data_dog_stream_up) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "流式消费者未存活（stream_up=0）"
            description: "stream 工作负载开了但没有副本在消费：日志会停在上游不落库。"
        {{- end }}
        - alert: DataDogStreamDropped
          # 队列满丢弃 = 背压证据（推式源）。丢的是消息，不是延迟。
          expr: increase(data_dog_stream_dropped_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "流式队列满导致丢弃消息（10 分钟内）"
            description: "消费跟不上或下游阻塞。先扩消费者副本，再看消费延迟直方图。"
        - alert: DataDogReplicationLagHigh
          # 单区域部署没有这个 series，规则自然不触发（inert），不需要按 region 开开关。
          expr: max by (from, to) (data_dog_replication_lag_seconds) > 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "跨区域复制延迟 > 60s（from/to 见标签）"
            description: "RPO > 0 是应用层近似的已知边界；持续落后说明链路或上游写入压力异常。"
    # ---- 模型调用：同步调查"是模型慢还是我们慢"（分开看）----
    - name: data-dog.llm
      rules:
        - alert: DataDogLlmLatencyP95High
          # 只按 le 聚合：vendor/model/outcome 的基数不进 PromQL（否则每加一个模型就多一条序列）。
          # 失败与超时**也计入**——只统计成功样本会把 P95 系统性低估（慢请求常以超时收场）。
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(data_dog_llm_request_duration_seconds_bucket[10m]))
            ) > {{ .Values.prometheusRule.llmLatencyP95Seconds }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LLM 请求 P95 > 60s（持续 15 分钟）"
            description: >-
              同步调查要等一次真 LLM。持续超标通常是上游限流或网络，而不是本服务；
              先看 vendor/model 维度的 http 侧错误率，再看异步队列深度是否同步上涨。
        - alert: DataDogLlmFailureRateHigh
          # 超时 + 不可用 / 全部请求。clamp_min 防分母为 0（没流量时不该判成 100% 失败）。
          expr: |
            (
              sum(rate(data_dog_llm_request_duration_seconds_count{outcome=~"timeout|unavailable"}[10m]))
              /
              clamp_min(sum(rate(data_dog_llm_request_duration_seconds_count[10m])), 0.001)
            ) > {{ .Values.prometheusRule.llmFailureRate }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "LLM 超时/不可用占比 > 5%（持续 15 分钟）"
            description: >-
              失败会 **fail-closed**（判定降级为 needs_human_review），所以这条是"人在替模型兜底"。
              先看上游额度/密钥是否过期，再看是不是网络策略变更。

    # ---- 证据引用：失败与越权探测要能看见 ----
    - name: data-dog.evidence
      rules:
        - alert: DataDogEvidenceResolveFailed
          # execution_failed = 数据源抛异常或**没配好**（如 rawlog 未配置存放位置）。
          # 这类失败对使用者表现为"打不开原始日志"，此前只能靠用户报障。
          expr: increase(data_dog_evidence_resolve_total{outcome="execution_failed"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "证据引用解析失败（execution_failed，15 分钟内）"
            description: >-
              常见根因：DD_RAWLOG_BASE_DIR / DD_RAWLOG_BASE_URL 没配或指错、对象存储不可达、
              raw_log_ref 指向的键在受控目录里不存在（截断/清理）。
        - alert: DataDogEvidenceDeniedSpike
          # denied = 该租户读了不属于它的引用。**正常应为 0**；涨起来是越权探测信号。
          expr: increase(data_dog_evidence_resolve_total{outcome="denied"}[15m])
            > {{ .Values.prometheusRule.evidenceDeniedThreshold }}
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "证据引用被拒次数异常（15 分钟内 > 阈值）"
            description: >-
              先用 GET /v1/audit 与访问日志定位是哪个租户/来源 IP，再判断是配置错还是探测。
              指标本身**不带租户标签**（基数），所以定位要靠审计而不是这里。
    {{- if .Values.partition.enabled }}
    # ---- 存储结构：A9 分区有效期（只在声明了分区维护的部署里断言）----
    - name: data-dog.storage
      rules:
        - alert: DataDogPartitionHorizonLow
          # 用**时间戳减 time()**，而不是应用上报的"还剩几天"：Gauge 会陈旧，
          # 时间戳由 Prometheus 自己推进，应用不再重算也照样会响（见 core/metrics.py）。
          expr: |
            (min(data_dog_partition_end_timestamp_seconds{kind="future"}) - time())
              < {{ .Values.prometheusRule.partitionHorizonSeconds }}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "telemetry_events 分区有效期不足（< 14 天）"
            description: >-
              分区覆盖的最远上界已不足 14 天。到期后**写入会直接失败**：
              no partition of relation "telemetry_events" found for row。
              处置：跑 python scripts/partition_telemetry.py --ensure-months 3（幂等），
              并检查 partition CronJob 是否被停用/失败。
        - alert: DataDogPartitionHorizonUnknown
          # 比"有效期不足"更早的警报：分区开着，却一个样本都没有。
          # 此时上面的规则对空向量求值**永不触发**——Prometheus 不会告诉你"规则瞎了"。
          expr: absent(data_dog_partition_end_timestamp_seconds{kind="future"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "分区有效期指标缺失（absent 超过 1 小时）"
            description: >-
              该规则组只在 partition.enabled=true 时渲染；此时没有样本说明
              /metrics 没刷新到（抓取失败？）或 telemetry_events 并不是分区表。
              两种都会让"有效期不足"那条变成死规则。
        - alert: DataDogPartitionDdlSkipped
          # 结构变更**被跳过**是可预期的（滚动发布时 N 个副本只有一个能抢到租约），
          # 但"一直在被跳过"就说明那个持有者卡住了/崩了：分区该补而没补，只是没人说。
          for: 0m
          expr: increase(data_dog_partition_ddl_skipped_total[24h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "分区结构变更 24 小时内出现过跳过（reason 见标签）"
            description: >-
              滚动发布期间的少量 lease_held 属预期；持续出现要查持有者是否卡在长 DDL /
              进程崩了但租约未过期。reason=convert_busy 表示库层咨询锁被另一个转换占着，
              本轮**没有排队**（有意：排队会变成 statement_timeout 后的 QueryCanceled）。
              要看"被谁挡的"得看日志/共享状态（Prometheus 不带 owner 标签，避免基数爆炸）。
        - alert: DataDogPartitionDdlLeaseStuck
          # 默认 TTL 900s。持有超过 30 分钟 = 要么长 DDL 卡住，要么持有者死了但租约还没到期
          # （崩溃到接管之间至多空窗一个 TTL）。0（无主）不会触发这条。
          for: 5m
          expr: max(data_dog_partition_ddl_lease_age_seconds) > 1800
          labels:
            severity: warning
          annotations:
            summary: "分区 DDL 租约被持有超过 30 分钟"
            description: >-
              转换含整表拷贝，慢是可能的；但"远超 TTL 还在持有"通常意味着持有者卡在
              锁等待/网络，或进程崩了。此时别的副本/定时任务都**不会**补分区。
              先看共享状态里的 owner，再决定是等它跑完还是做人工处置。
    {{- end }}
{{- end }}
