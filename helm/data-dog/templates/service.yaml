apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-dog.fullname" . }}
  labels:
    {{- include "data-dog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "data-dog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
