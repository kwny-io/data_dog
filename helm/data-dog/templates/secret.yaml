{{- /*
  仅当 secret.create=true 时渲染。**生产不要用**——密钥会以明文进 values 与
  etcd 中的 Secret 对象。生产用 secret.existingSecret 指向外部托管（external-secrets /
  sealed-secrets / Vault）。这里仅为 kind/本地一键起图方便。
*/ -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-dog.fullname" . }}-secret
  labels:
    {{- include "data-dog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
