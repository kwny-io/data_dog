# Alembic config (data_dog database migrations).
#
# NOTE: this file must stay ASCII-only -- alembic reads it with the locale
# encoding (GBK on this machine), so non-ASCII comments break it.
#
# The DB URL is deliberately NOT set here: alembic/env.py reads it from
# DD_DATABASE_URL (same source as the app), so migrations and the running
# app can never point at different databases.
#
# Commands (or use `make migrate` / `make migrate-new m="..."`):
#   alembic upgrade head                      apply all migrations
#   alembic current                           show current revision
#   alembic history                           show history
#   alembic revision --autogenerate -m "..."  generate a migration
#   alembic downgrade -1                      roll back one step

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped filenames for chronological ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# No extra blank-line diffing in migrations
version_path_separator = os

[post_write_hooks]
# Empty: this project does not force-format migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
