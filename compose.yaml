# data_dog 一键起服务：应用 + PostgreSQL + 控制台（web/）
#
#   docker compose up -d --build     # 起（后台），首次会构建两个镜像
#   docker compose ps                # 看状态/健康
#   docker compose logs -f app       # 看服务日志
#   docker compose down              # 停（保留数据卷）
#   docker compose down -v           # 停并删数据卷（清库，慎用）
#
# 只想跑后端（不构建前端镜像，离线也成立）：
#   docker compose up -d --build db app
#
# 本文件里的口令是**本地开发默认值**，可用环境变量覆盖（见 .env.example）。
# 生产请勿沿用默认口令，应通过密钥管理注入。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_dog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_dog_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-data_dog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 探数据库是否可接受连接；app 会等它健康后才启动
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_dog} -d ${POSTGRES_DB:-data_dog}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # 仅本机调试需要看库时才放开（默认不对外暴露 5432）
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

  app:
    build: .
    image: data-dog:0.1.0
    environment:
      # 应用连库：容器网络内用服务名 db（不是 localhost）
      DD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-data_dog}:${POSTGRES_PASSWORD:-data_dog_dev_pw}@db:5432/${POSTGRES_DB:-data_dog}
      DD_SERVICE_NAME: data-dog
      DD_SERVICE_PORT: "8000"
      # 对外提供访问时**必须**设置；留空则不校验（仅适合本机开发）
      DD_API_KEY: ${DD_API_KEY:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------- 控制台
  # Next.js 15 产品控制台。**服务端**变量在运行期注入（见 web/Dockerfile 顶部说明）：
  # 浏览器不持凭据，只请求同源 /api/dd/*，由服务端代理附 X-API-Key / X-Tenant-Id。
  web:
    profiles: ["web"]
    build:
      context: ./web
      args:
        # 内网/加速器：WEB_NODE_IMAGE=docker.1ms.run/library/node:22-alpine
        NODE_IMAGE: ${WEB_NODE_IMAGE:-node:22-alpine}
        # 内网 npm 镜像；留空用镜像默认 registry
        NPM_REGISTRY: ${WEB_NPM_REGISTRY:-}
    image: data-dog-web:0.1.0
    environment:
      # 容器网络内用服务名 app（不是 localhost）——写错就会“页面能开、数据全空”
      DD_WEB_API_BASE_URL: http://app:8000
      # 与后端同一把钥匙；后端未开鉴权时留空即可
      DD_WEB_API_KEY: ${DD_API_KEY:-}
      DD_WEB_TENANT: ${DD_TENANT:-tenant-demo}
      # 本地演示默认跳过控制台鉴权门；生产请改成 DD_WEB_BASIC_AUTH，
      # 或走反代身份（DD_WEB_TRUST_PROXY_AUTH=1 + 它要求的附带条件，否则启动期直接拒起）
      DD_WEB_ALLOW_ANONYMOUS: ${DD_WEB_ALLOW_ANONYMOUS:-1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # 探首页（容器内固定地址，非用户可控 URL）；镜像自身也带同样的 HEALTHCHECK
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
